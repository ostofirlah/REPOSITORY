<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;width:100%;margin:0;background:#e8eef3;font-family:Arial,sans-serif}.legend{position:absolute;z-index:1000;bottom:18px;left:12px;right:12px;background:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 2px 14px #0002;font-size:12px;color:#374151}.legend b{display:block;margin-bottom:4px;color:#111827;font-size:13px}.leaflet-control-attribution{font-size:9px!important}</style>
</head><body><div id="map"></div><div class="legend"><b>Device location &amp; network destinations</b><span id="hint">Waiting for location permission… No live connection feed is connected yet.</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{worldCopyJump:true}).setView([20,0],2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
let deviceMarker=null;
window.setDeviceLocation=function(lat,lon){if(!Number.isFinite(lat)||!Number.isFinite(lon))return; if(!deviceMarker){deviceMarker=L.circleMarker([lat,lon],{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindPopup('This device'); map.setView([lat,lon],4);}else{deviceMarker.setLatLng([lat,lon]);}document.getElementById('hint').textContent='Device location received. Destination lines will appear when a real monitoring engine is connected.';};
if(window.AndroidBridge&&AndroidBridge.mapReady)AndroidBridge.mapReady();
</script></body></html>
